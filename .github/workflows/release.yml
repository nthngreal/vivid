name: Build AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install PySide6-Essentials pyinstaller
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          echo "$PWD/squashfs-root/usr/bin" >> "$GITHUB_PATH"

      - name: Build
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Vivid-x86_64.AppImage
          path: dist/Vivid-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vivid-x86_64.AppImage
